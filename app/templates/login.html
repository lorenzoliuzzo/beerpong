{% extends "base.html" %}
{% block content %}
<h1>Area staff</h1>
<form class="card" method="post" action="/login">
  <label for="pin">PIN</label>
  {# A plain text field so password managers never autofill a saved password for this host. #}
  <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off"
         spellcheck="false" required style="font-size:1.6rem;letter-spacing:.3em;text-align:center;-webkit-text-security:disc">
  <button class="wide" type="submit">Entra</button>
  <p class="muted small">Arbitri: PIN del proprio campo. Organizzazione: PIN admin.</p>
</form>
{% endblock %}
